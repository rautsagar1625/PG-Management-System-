name: CD — Staging Deploy

on:
  push:
    branches: [staging]

concurrency:
  group: cd-staging
  cancel-in-progress: true

env:
  PNPM_VERSION: 9

jobs:
  validate:
    name: Validate Migrations
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v3
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check migration files
        run: |
          echo "Migration files found:"
          ls prisma/migrations/

      - name: Validate Prisma schema
        run: pnpm --filter @pg-system/api exec prisma validate --schema=../../prisma/schema.prisma

  build-api:
    name: Build API Image
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to registry
        if: ${{ env.REGISTRY_URL != '' }}
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.REGISTRY_URL }}
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}
        env:
          REGISTRY_URL: ${{ secrets.REGISTRY_URL }}

      - name: Build (and push if registry configured)
        uses: docker/build-push-action@v5
        with:
          context: .
          file: apps/api/Dockerfile
          push: ${{ secrets.REGISTRY_URL != '' }}
          tags: |
            ${{ secrets.REGISTRY_URL && format('{0}/pg-system-api:staging', secrets.REGISTRY_URL) || 'pg-system-api:staging' }}
            ${{ secrets.REGISTRY_URL && format('{0}/pg-system-api:{1}', secrets.REGISTRY_URL, github.sha) || format('pg-system-api:{0}', github.sha) }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  build-web:
    name: Build Web Image
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to registry
        if: ${{ env.REGISTRY_URL != '' }}
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.REGISTRY_URL }}
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}
        env:
          REGISTRY_URL: ${{ secrets.REGISTRY_URL }}

      - name: Build (and push if registry configured)
        uses: docker/build-push-action@v5
        with:
          context: .
          file: apps/web/Dockerfile
          push: ${{ secrets.REGISTRY_URL != '' }}
          tags: |
            ${{ secrets.REGISTRY_URL && format('{0}/pg-system-web:staging', secrets.REGISTRY_URL) || 'pg-system-web:staging' }}
          build-args: |
            NEXT_PUBLIC_API_URL=${{ secrets.STAGING_API_URL || 'https://api.staging.pgmanager.app/api/v1' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    needs: [build-api, build-web]
    environment: staging
    steps:
      - uses: actions/checkout@v4

      - name: Deploy via SSH
        if: ${{ env.STAGING_HOST != '' }}
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.STAGING_HOST }}
          username: ${{ secrets.STAGING_USER }}
          key: ${{ secrets.STAGING_SSH_KEY }}
          script: |
            cd /opt/pg-system
            docker compose pull
            docker compose up -d --no-deps api web
            docker compose exec -T api npx prisma migrate deploy --schema=../../prisma/schema.prisma
        env:
          STAGING_HOST: ${{ secrets.STAGING_HOST }}

      - name: Deployment summary
        run: |
          echo "## Staging Deployment" >> $GITHUB_STEP_SUMMARY
          echo "- **Branch:** ${{ github.ref_name }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Commit:** \`${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Triggered by:** ${{ github.actor }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Required Secrets for Full Deploy" >> $GITHUB_STEP_SUMMARY
          echo "- \`REGISTRY_URL\` — Docker registry" >> $GITHUB_STEP_SUMMARY
          echo "- \`STAGING_HOST\` — SSH host" >> $GITHUB_STEP_SUMMARY
          echo "- \`STAGING_USER\` — SSH user" >> $GITHUB_STEP_SUMMARY
          echo "- \`STAGING_SSH_KEY\` — SSH private key" >> $GITHUB_STEP_SUMMARY
          echo "- \`STAGING_API_URL\` — Public API URL" >> $GITHUB_STEP_SUMMARY
