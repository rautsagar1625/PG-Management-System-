services:
  postgres:
    image: postgres:16-alpine
    container_name: pg_system_dev_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: pguser
      POSTGRES_PASSWORD: pgpassword
      POSTGRES_DB: pg_system
    volumes:
      - pg_system_dev_postgres:/var/lib/postgresql/data
    ports:
      - "5434:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pguser -d pg_system"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: pg_system_dev_redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - pg_system_dev_redis:/data
    ports:
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pg_system_dev_postgres:
  pg_system_dev_redis:
